# Test-time caps doubled provisionally at the user's request, 10-22.
# Slow periods are doubled; terminate-after counts stay fixed, so termination
# deadlines double as well.
# The two test suites (docs/development/workflow.md): the focused one, every
# test but the fuzzy ones and the tiers' binaries below, within 30 seconds; and
# the fuzzy one, the test binaries named fuzzy_* beside each world's focused
# tests, within 2 minutes. A suite past its budget fails, naming the tests it
# stopped; a test past its slow period is flagged SLOW as it runs. The process,
# live, QA and browser tiers have profiles of their own, at the end.

# The private service composition keeps its sign-in world in sign_in.rs;
# its seeded sweep belongs to the fuzzy profile alone.
[profile.default]
default-filter = "not test(/^tests::sign_in::fuzzy_/) & not binary(/^fuzzy_/) & not binary(/^(process|live|live_github)$/) & not binary(/^qa_/) & not test(/::qa_/) & not binary(/^browser_/)"
global-timeout = "30s"
slow-timeout = { period = "6s" }

# The worlds' tests first, the longest, then the many short unit tests behind
# them, so that the run ends close to its total over the threads.
[[profile.default.overrides]]
filter = "kind(test)"
priority = 10

[profile.fuzzy]
default-filter = "(binary(/^fuzzy_/) | (package(temper-service) & test(/^tests::sign_in::fuzzy_/))) & not binary(/^(process|live|live_github)$/) & not binary(/^qa_/)"
global-timeout = "120s"
slow-timeout = { period = "40s" }

# The walking story's eight shards first, the suite's longest tests.
[[profile.fuzzy.overrides]]
filter = "test(/^fuzzy_walking_shard_/)"
priority = 20

# Measuring, not gating: no budget. With -j 1, each test's own time:
#   cargo nextest run --workspace --profile measure -j 1
#   cargo nextest run --workspace --profile measure -j 1 --ignore-default-filter -E 'binary(/^fuzzy_/)'
[profile.measure]
global-timeout = "2h"
slow-timeout = { period = "120s" }

[profile.process]
# The process tier (docs/design/domain/testing.md, 2.6): crates/temper's
# process binary alone, one test at a time, which scripts/proof-one-process.sh
# runs.
default-filter = "binary(=process)"
global-timeout = "20m"
test-threads = 1

[[profile.process.overrides]]
# R8 runs its original exact-base control before the deployment-history variants.
filter = "test(=a_restart_over_a_budget_held_review_answers_ctl)"
priority = 20

[profile.live]
# The live tier (docs/design/domain/testing.md, 2.7): crates/temper's live binary
# alone, one test at a time, which scripts/proof-live.sh runs.
default-filter = "binary(=live) | binary(=live_github)"
global-timeout = "50m"
test-threads = 1
retries = 0

[profile.qa]
# The QA passes' tests (agents' roles/owners.md, 4.6): the binaries
# named qa_*, and private service tests named qa_* within its unit binary,
# which the gate builds and does not run. One at a time: some start the shipped binary.
default-filter = "binary(/^qa_/) | test(/::qa_/)"
global-timeout = "20m"
test-threads = 1

# Chromium against temper serve, one test at a time (client/browser.md, 4.3).
[profile.browser]
default-filter = "package(temper-client-browser-world) & binary(/^browser_/)"
global-timeout = "120s"
slow-timeout = { period = "40s", terminate-after = 3 }
test-threads = 1
