[package]
name = "temper-protocol-records"
description = "Versioned forge records and startup access"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["forge"]
forge = ["dep:skein-forge", "dep:skein-forge-setup", "dep:skein-forge-connection", "dep:jig-protocol-config"]

[dependencies]
skein-codec.workspace = true
skein-lib.workspace = true
skein-forge = { workspace = true, optional = true }
skein-forge-setup = { workspace = true, optional = true }
skein-forge-connection = { workspace = true, optional = true }
jig-protocol-config = { workspace = true, optional = true }

[dev-dependencies]
skein-codegen.workspace = true
skein-scratch.workspace = true

[lints]
workspace = true
