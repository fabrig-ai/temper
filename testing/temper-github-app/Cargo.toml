[package]
name = "temper-github-app"
description = "The fake GitHub App and its durable start records"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
temper-protocol-records.workspace = true
temper-protocol-store.workspace = true
temper-service.workspace = true
jig-protocol-config.workspace = true
jig-protocol-store.workspace = true
jig-domain-core.workspace = true
skein-fake-forge-github.workspace = true
skein-forge-connection.workspace = true
skein-lib.workspace = true
skein-io.workspace = true
skein-shell.workspace = true

[dev-dependencies]
skein-scratch.workspace = true
skein-forge.workspace = true
skein-forge-setup.workspace = true

[lints.rust]
unsafe_code = "forbid"
elided_lifetimes_in_paths = "deny"
unused_must_use = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_panics_doc = "allow"
missing_errors_doc = "allow"
