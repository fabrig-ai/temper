[package]
name = "temper-client-browser-world"
description = "temper's browser tier: Chromium against temper serve"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
smith-agent-shell.workspace = true
temper-engine-domain.workspace = true
skein-fake-person-browser.workspace = true
skein-fake-person.workspace = true
skein-fake-peers.workspace = true
skein-fake-oauth.workspace = true
skein-fake-forge-domain.workspace = true
skein-fake-forge-github.workspace = true
skein-forge.workspace = true
skein-json.workspace = true
skein-oauth.workspace = true
skein-http.workspace = true
jig-protocol-config.workspace = true
skein-browser.workspace = true
skein-scratch.workspace = true
skein-lib.workspace = true
skein-ui.workspace = true
# A normal dependency, so that scripts/bundle.sh can build it: cargo 1.95
# panics on `cargo build -p` of a dev-only package.
skein-ui-bundle.workspace = true
serde_json.workspace = true
skein-tls-world.workspace = true
jig-channel-world.workspace = true
jig-client.workspace = true
jig-client-protocol-wire.workspace = true
jig-client-protocol-link.workspace = true
jig-client-fake-person-browser.workspace = true

[dev-dependencies]
skein-shell.workspace = true
temper-one-process-world = { path = "../one-process" }
skein-ui-web.workspace = true
temper-playground-world = { path = "../playground" }
temper-client-domain.workspace = true
skein-io.workspace = true
skein-world.workspace = true
skein-sim = { git = "https://github.com/fabrig-dev/skein.git" }

[lints.rust]
unsafe_code = "forbid"
elided_lifetimes_in_paths = "deny"
unused_must_use = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_panics_doc = "allow"
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"
unwrap_used = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
disallowed_types = "deny"
disallowed_methods = "deny"

[[test]]
name = "qa_sign_in_browser"
path = "tests/qa_sign_in_browser.rs"
