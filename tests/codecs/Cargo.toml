[package]
name = "temper-codecs-world"
description = "temper's generated codecs and foreign document decoders world"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
skein-scratch.workspace = true
skein-lib.workspace = true

[dev-dependencies]
skein-io.workspace = true
skein-forge.workspace = true
temper-protocol-records = { workspace = true, features = ["forge"] }
jig-protocol-config.workspace = true
skein-forge-connection.workspace = true
skein-fake-forge-github.workspace = true
skein-forge-setup.workspace = true
temper-engine-domain-forge.workspace = true
skein-forge-client.workspace = true
temper-engine-domain-forge-change.workspace = true
temper-engine-domain-forge-issues.workspace = true
jig-client-protocol-wire.workspace = true
temper-client-protocol-wire.workspace = true
temper-protocol-store.workspace = true
skein-codegen.workspace = true
temper-protocol-worker-wire.workspace = true

[lints.rust]
unsafe_code = "forbid"
elided_lifetimes_in_paths = "deny"
unused_must_use = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_panics_doc = "allow"
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"
unwrap_used = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
disallowed_types = "deny"
disallowed_methods = "deny"
