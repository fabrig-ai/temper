[package]
name = "temper-twin"
description = "A stopped deployment's transcripts as a scripted LLM twin"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "twin"
path = "src/main.rs"

[dependencies]
temper-fake.workspace = true
jig-protocol-store.workspace = true
smith-transcript.workspace = true
skein-lib.workspace = true
skein-fail-stop.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }

[lints.rust]
unsafe_code = "forbid"
elided_lifetimes_in_paths = "deny"
unused_must_use = "deny"
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_panics_doc = "allow"
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"
unwrap_used = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
disallowed_types = "deny"
disallowed_methods = "deny"

[dev-dependencies]
skein-scratch.workspace = true
jig-domain-core.workspace = true
